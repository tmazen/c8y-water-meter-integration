[package]
name = "c8y_oms_parser_service"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"
thiserror = "1.0"
#ctr = "0.9"

# Cryptography for OMS Modes 5 & 7
aes = "0.8"
cbc = "0.1"
cmac = "0.7"
cipher = "0.4"

tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "c8y_oms_parser_service"
path = "src/lib.rs"

[[bin]]
name = "c8y_oms_parser_service"
path = "src/main.rs"